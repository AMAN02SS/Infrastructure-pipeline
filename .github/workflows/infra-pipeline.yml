name: Infrastructure Pipeline

on:
  pull_request:
    branchs:
      - main
  push:
    branchs:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  static-checks:
    name: Terraform Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft-fail: false

  terraform-plan:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: static-checks
    environment: development

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENENT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      - name: Initialize Terraform remote backend
        run: |
          terraform init -input=false \
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
          -backend-config="key=dev.terraform.tfstate" \
          -backend-config="use_oidc=true" \
          -backend-config="use_azuread_auth=true" \
          -backend-config="client_id=${{ vars.AZURE_CLIENT_ID }}" \
          -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
          -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform plan
          path: tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan

    environment: development

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENENT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      - name: Initialize Terraform remote backend
        run: |
          terraform init -input=false \
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
          -backend-config="key=dev.terraform.tfstate" \
          -backend-config="use_oidc=true" \
          -backend-config="use_azuread_auth=true" \
          -backend-config="client_id=${{ vars.AZURE_CLIENT_ID }}" \
          -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
          -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Apply saved terraform plan
        run: terraform apply -input=false tfplan
